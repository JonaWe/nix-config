# ntfy renders the webhook itself via its built-in alertmanager template, so
# no bridge service is needed between the two.

global:
  resolve_timeout: 5m

route:
  receiver: ntfy
  group_by: [host, alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers:
        - severity = "critical"
      receiver: ntfy-critical
      repeat_interval: 4h

receivers:
  - name: ntfy
    webhook_configs:
      - url: "http://127.0.0.1:8019/homelab-alerts?tpl=homelab"
        send_resolved: true

  - name: ntfy-critical
    webhook_configs:
      - url: "http://127.0.0.1:8019/homelab-alerts?tpl=homelab"
        send_resolved: true
