# Image update notifier.
#
# The file provider needs no container socket, which is what lets one process
# cover both the docker stack and the rootless podman user managers.
#
# endpoint, topic and schedule are overridden by DIUN_NOTIF_NTFY_* /
# DIUN_WATCH_SCHEDULE from the NixOS module.

db:
  path: /var/lib/diun/diun.db

watch:
  workers: 5
  schedule: "0 6 * * *"
  jitter: 30s
  # Otherwise the very first run reports every single image as "new".
  firstCheckNotif: false

notif:
  ntfy:
    endpoint: http://127.0.0.1:8019
    topic: homelab-updates
    priority: 3
    timeout: 10s

providers:
  file:
    filename: /etc/monitoring/diun/images.yml
