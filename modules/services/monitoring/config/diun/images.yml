# Images diun watches; also the overview of what version runs where.
#
#   default          - mutable tag (:latest, :stable); reports when its digest moves.
#   watch_repo: true - pinned tag; reports when a newer tag appears. Required
#                      once pinned, since a pinned tag's digest never moves.
#                      Set max_tags/include_tags to stay inside registry rate limits.

# --- monitoring stack (pinned, so watch for new versions) ---
- name: docker.io/prom/prometheus:v3.11.3
  watch_repo: true
  max_tags: 20
  include_tags:
    - ^v\d+\.\d+\.\d+$
- name: docker.io/grafana/loki:3.7.2
  watch_repo: true
  max_tags: 20
  include_tags:
    - ^\d+\.\d+\.\d+$
- name: docker.io/grafana/grafana:13.0.1
  watch_repo: true
  max_tags: 20
  include_tags:
    - ^\d+\.\d+\.\d+$
- name: docker.io/prom/alertmanager:v0.31.1
  watch_repo: true
  max_tags: 20
  include_tags:
    - ^v\d+\.\d+\.\d+$
- name: docker.io/binwiederhier/ntfy:v2.28.0
  watch_repo: true
  max_tags: 20
  include_tags:
    - ^v\d+\.\d+\.\d+$

