# Images diun watches; also the overview of what version runs where.
#
#   default          - mutable tag (:latest, :stable); reports when its digest moves.
#   watch_repo: true - pinned tag; reports when a newer tag appears. Required
#                      once pinned, since a pinned tag's digest never moves.
#                      sort_tags: semver is required — the default picks tags
#                      alphabetically, which drags in old patch branches. With
#                      semver + max_tags diun tracks the highest versions, so a
#                      new release always lands in the set and shows as "new".

# --- monitoring stack (pinned, so watch for new versions) ---
- name: docker.io/prom/prometheus:v3.11.3
  watch_repo: true
  sort_tags: semver
  max_tags: 5
  include_tags:
    - ^v\d+\.\d+\.\d+$
- name: docker.io/grafana/loki:3.7.2
  watch_repo: true
  sort_tags: semver
  max_tags: 5
  include_tags:
    - ^\d+\.\d+\.\d+$
