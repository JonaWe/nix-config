# Scrape targets are maintained by hand: this file is what runs, nothing is
# generated. A new service is not monitored until it is listed here.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    host: ant

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # instance is set explicitly; otherwise it defaults to the target address,
  # which reads badly in alerts and breaks once a second host is added.
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels: { host: ant, instance: ant }

  - job_name: zfs
    static_configs:
      - targets: ["127.0.0.1:9134"]
        labels: { host: ant, instance: ant }

  - job_name: smartctl
    static_configs:
      - targets: ["127.0.0.1:9633"]
        labels: { host: ant, instance: ant }

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels: { host: ant, instance: ant }

  - job_name: loki
    static_configs:
      - targets: ["127.0.0.1:3100"]
        labels: { host: ant, instance: ant }

  - job_name: grafana
    static_configs:
      - targets: ["127.0.0.1:3300"]
        labels: { host: ant, instance: ant }

  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]
        labels: { host: ant, instance: ant }
