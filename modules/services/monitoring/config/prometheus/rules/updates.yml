groups:
  - name: updates
    rules:
      # The failure that killed recyclarr: the tag vanished from the registry,
      # so the next restart has nothing to pull.
      - alert: ContainerImageUnreachable
        expr: homelab_image_info{state="unreachable"} == 1
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }}: image cannot be checked"
          description: "{{ $labels.repo }}:{{ $labels.current }} did not answer. A vanished tag breaks the service on its next restart."

      - alert: ContainerUpdateAvailable
        expr: homelab_image_info{state="update"} == 1
        for: 24h
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.service }}: {{ $labels.current }} -> {{ $labels.available }}"
          description: "A newer tag matching the pinned pattern exists. Bump it in the .container file."

      - alert: ImageVersionCheckStale
        expr: |
          time() - node_textfile_mtime_seconds{file=~".*homelab_image_versions.prom"} > 36 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Image version check is stale on {{ $labels.host }}"
          description: "Nothing has compared running against available versions for over 36 hours."
